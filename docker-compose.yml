services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: dicerace
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dicerace}
      POSTGRES_DB: dicerace
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dicerace"]
      interval: 5s
      timeout: 3s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      DATABASE_URL: postgresql://dicerace:${POSTGRES_PASSWORD:-dicerace}@db:5432/dicerace
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  pgdata:
