name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:game
      - run: npx prisma generate --schema server/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test
      - run: npm run build -w @dicerace/client

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          docker build -f server/Dockerfile -t dicerace-server .
          docker build -f client/Dockerfile -t dicerace-web .
